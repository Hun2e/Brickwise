# 한국어 상품·형태 용어 → 영어 세트명 용어 (PM 관리 데이터, T-010 피드백 1차)
# - 조건 탐색(T-010)의 추출 조건 검증에 쓴다. 질문에 왼쪽 용어가 있으면 오른쪽 영어 단어를
#   name_keywords / exclude_keywords로 받아들인다.
# - 기체·캐릭터 이름은 ko_aliases(T-005)가 담당한다. 여기에는 상품 형태·일반 명사만 둔다.
# - 영어 단어는 실제 세트명(sets.name)에 쓰이는 표기다 (2026-10-22 범위 378세트 이름에서 확인).

