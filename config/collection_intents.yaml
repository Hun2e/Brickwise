# 소망·부정·질문은 변경 동사보다 우선한다. 대상 번호 해석은 별도 서비스가 맡는다.
wish:
  - '(?:갖고|가지고|사고|구매하고)\s*싶'
  - '살\s*까'
negative:
  - '지\s*마(?:세요|요|라|[.!?\s]|$)'
  - '(?:안|못)\s*(?:해|할|했)'
  - '없(?:어|다|네|는데|습니다)'
  - '(?:안|못)\s*(?:가지고|갖고|보유|등록|추가|삭제|제거|바꿔|빼|넣)'
  - '(?:않|말)(?:아|고|자|고요|아요|아줘|아주세요|습니다|았|을|지|다)'
  - '아니(?:야|에요|다|고|라)'
question:
  - '(?:있어|있어요|있니|있나요|있나|있을까|몇\s*개|몇\s*개야|등록할까|추가할까)\s*\?$'
  - '(?:있니|있나요|있을까|몇\s*개|몇\s*개야)\s*[.!]?\s*$'
remove:
  - '(?:빼\s*(?:줘|주세요|줄래)|삭제|제거)'
set:
  - '(?:등록|바꿔|바꾸|수정|정정|변경)'
add:
  - '(?:추가|더|넣어)'
statement:
  - '(?:(?:가지고|갖고)\s*)?있(?:어|다|네|어요|습니다)'
  - '보유\s*(?:중|해|하고)'
  - '개\s*(?:야|예요|에요)'
correction:
  - '(?:실제로는|사실은|정확히는)'
quantity_suffix: '(?:\s*개)?(?=\s|$|[.!?]|로|야|예요|에요|있|더|추가|등록|보유|가지고|갖고|바꿔|뿐|만|를|을)'
number_quantity: '(?<![0-9A-Za-z_.,＋+\-])(?:[+\-]?\d+(?:\.\d+)?)\s*개'
unsupported_quantity: '(?:열|스물|서른|마흔|쉰|예순|일흔|여든|아흔)\s*(?:하나|한|두|둘|세|셋|네|넷|다섯|여섯|일곱|여덟|아홉)'
quantities:
  하나: 1
  한: 1
  두: 2
  둘: 2
  세: 3
  셋: 3
  네: 4
  넷: 4
  다섯: 5
  여섯: 6
  일곱: 7
  여덟: 8
  아홉: 9
  열: 10
