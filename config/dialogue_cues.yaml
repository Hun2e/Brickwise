# 문맥 해석은 이 사전과 DB만 사용한다.
ordinals:
  '첫\s*번째|첫째': 1
  '두\s*번째|둘째': 2
  '세\s*번째|셋째': 3
  '네\s*번째|넷째': 4
  '다섯\s*번째|다섯째': 5
ordinal_number: '(?<![\w-])(\d+)\s*(?:번째|번(?!호)|위)'
last: ['마지막', '맨 끝']
references: ['그거', '이거', '그 세트', '이 세트', '그 기체', '이 기체', '얘']
refine: ['그중', '그 중', '이 중', '여기서', 'which of them', 'among them', 'of those']
ignore_color_pattern: '색(상|깔)\S*\s*(무시|상관\s*없)'
ignore_color_cues: ['색 무시', '색은 무시', '색을 무시', '색 상관없이']
exact_cues: ['색상까지 맞', '색깔까지 맞', '정확 일치', '색상도 고려', '색상 무시하지']
search_cues: ['찾아', '검색', '탐색', '세트 목록', 'find', 'search', 'show me', 'list', 'which sets', 'sets with', 'sets that']
recommend_pattern: '(?:내|보유|가진).*(?:뭐|무엇|다른).*(?:만들|제작)|추천|\brecommend again\b'
'yes': ['응', '네', '예', '맞아', '확인']
'no': ['아니', '아니요', '취소']
quantities: {'한': 1, '하나': 1, '두': 2, '둘': 2, '세': 3, '셋': 3, '네': 4, '넷': 4}
missing_pattern: '부족(?:한|이|\s*수량|\s*부품)?\s*([\d,]+)\s*개?\s*(이하|미만|이상|초과)'
