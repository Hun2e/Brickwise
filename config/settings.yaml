# 튜닝 값의 단일 출처. 코드에 숫자를 직접 쓰지 않는다 (AGENTS.md 5-1).

ui:
  title: "LEGO Archive & Build Planner"
  chat_placeholder: "선택한 세트에 대해 질문해 보세요"
  collection_placeholder: "보유 세트로 무엇을 만들 수 있나요?"
  explore_placeholder: "원하는 세트의 조건을 입력하세요"

server:
  max_question_chars: 4000
  keepalive_sec: 15
  catalog_max_age_sec: 300
  cors_origins: []
  static_dir: "web"

app:
  name: "BrickArchivePlanner"    # User-Agent 등에 쓰는 영문 이름 (서비스명 미확정, L7)
  version: "0.1"
  domain_label: "레고"           # 화면에 보일 도메인 이름
  risky_domain: false           # 건강·금융 등 위험 도메인이면 true → 면책 문구 표시
  disclaimer: "LEGO Group과 무관한 비공식 팬 프로젝트입니다."

llm:
  cache_enabled: true
  base_url: "https://api.openai.com/v1/"   # OpenAI 호환 엔드포인트
  chat_model: "gpt-5.4-nano"
  embedding_model: "text-embedding-3-small"
  temperature: 0
  send_temperature: true          # T-004: GMS gpt-5.4-nano가 temperature=0 허용 확인 → 재현성 위해 전송
  timeout_sec: 60
  max_retries: 1
  structured_method: "json_mode"     # T-004 스파이크로 확정 (파싱 100%, Router 25/25, 입력 토큰 최소)
  spike_questions_path: "eval/spike_questions.jsonl"
  spike_logs_dir: "logs"

paths:
  items: "data/raw/rebrickable"
  sqlite: "data/lego.sqlite"
  user_sqlite: "data/user.sqlite"
  collected_dir: "data/collected"
  docs_dir: "data/collected/docs"
  collect_sqlite: "data/collected/collect.sqlite"
  chroma_dir: "data/chroma"
  entity_rules: "config/entity_rules.yaml"
  ko_aliases_manual: "config/ko_aliases_manual.yaml"
  ko_terms: "config/ko_terms.yaml"
  unsupported_attrs: "config/unsupported_attrs.yaml"
  collection_intents: "config/collection_intents.yaml"
  dialogue_cues: "config/dialogue_cues.yaml"
  embed_cache: "data/collected/embed_cache.sqlite"

evaluation:
  error_log: "logs/eval_error.log"
  snapshot_dir: "data/eval_snapshot"
  snapshot_name: "m6-base"
  retrieval_file: "eval/retrieval.jsonl"
  routing_file: "eval/routing.jsonl"
  draft_file: "eval/drafts/retrieval_draft.jsonl"
  en_terms_cache: "eval/cache/en_terms.jsonl"
  results_dir: "eval/results"
  draft_count: 60
  korean_fraction: 0.75
  seed: 16
  repetitions: 3
  latency_collection: [["75301-1", 1], ["75300-1", 1], ["75257-1", 1]]
  recall_k: [1, 3, 5]
  primary_k: 5

index:
  docs_include_korean: true
  docs_group_policy: "tag"
  embed_batch_size: 64
  embed_max_retries: 3
  embed_retry_backoff_sec: 2
  meta_scopes: ["core", "compare_only"]
  generic_minifig_prefixes: ["Astromech Droid", "Protocol Droid", "Battle Droid", "Clone Trooper", "Stormtrooper", "Droid"]

collections:
  items: "set_meta"             # RAG 1
  docs: "set_docs"              # RAG 2

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_chars: 200
  header: true

verify:
  enabled: true
  ignore_single_digit: true
  p3_max_bullets: 6
  log_path: "logs/verification.jsonl"

retrieval:
  top_k: 5                      # 외부 문서 청크 수 (선택 항목 메타 청크 1건은 항상 별도로 포함)
  fetch_multiplier: 4
  similarity_fetch_k: 20        # 기존 top_k(5) × fetch_multiplier(4)와 동일
  query_mode: "question"       # expanded | question | dual  (ADR-017: 질문 원문 — 영어 확장어가 한국어 문서를 밀어냄)
  max_chunks_per_doc: 2
  max_series_chunks: 2
  max_group_chunks: 2
  max_list_chunks: 2
  history_turns: 4
  max_en_terms: 8
  p3_prompt_version: "p3-v2"    # T-012 비교(13문항): 문장 −20%·인용 +5·지연 −0.4초 → 사용자 결정으로 채택
  search_type: "mmr"            # similarity | mmr  (F2014, ADR-017)
  mmr_fetch_k: 40
  mmr_lambda: 0.7
  mmr_apply_caps: false         # MMR이 다양성을 맡으므로 문서당 상한을 끔 (빈자리 0)
  mmr_caps: "none"             # none | series_list_only | all; 기본값 변경은 PM 평가 후
  condition_candidates: 20      # F2011 조건 탐색 후보 수

collection:
  max_qty: 99
  max_queries: 3                # P1 v2 검색어 최대 수
  candidates_per_query: 5
  max_docs_per_item: 6
  max_docs_per_question: 2
  question_time_budget_sec: 30
  question_include_korean: true
  p1_prompt_version: "p1-v2.1"
  domain_intro_chars: 500
  domain_keywords: ["star wars", "스타워즈", "스타 워즈", "jedi", "제다이", "sith", "시스 로드", "시스 군주", "clone wars", "galactic empire", "rebel alliance", "lucasfilm", "lego", "레고", "skywalker", "스카이워커", "death star", "데스 스타", "millennium falcon", "밀레니엄 팔콘", "republic attack gunship", "boba fett", "보바 펫", "darth vader", "다스 베이더"]

external_api:
  request_interval_sec: 0.5
  max_retries: 3
  timeout_sec: 20
  interval_without_contact_sec: 6.5
  backoff_base_sec: 2.0

wikipedia:
  api_url: "https://{lang}.wikipedia.org/w/api.php"
  article_url: "https://{lang}.wikipedia.org/wiki/{title}"
  langs: ["en", "ko"]
  drop_sections:
    en: ["See also", "References", "Further reading", "External links", "Notes", "Bibliography", "Citations", "Sources"]
    ko: ["같이 보기", "각주", "외부 링크", "참고 문헌", "참고 자료", "출처", "내용주"]
  min_section_chars: 40
  seeds:
    - ["en", "Lego Star Wars"]
    - ["ko", "레고 스타워즈"]
    - ["en", "Millennium Falcon"]
    - ["en", "X-wing fighter"]
    - ["en", "TIE fighter"]
    - ["en", "AT-AT"]
    - ["en", "Star Destroyer"]

rebrickable:
  base_url: "https://cdn.rebrickable.com/media/downloads/"
  csv_dir: "data/raw/rebrickable"
  batch_size: 10000

scope:
  root_theme: "Star Wars"
  year_min: 2015
  year_max: 2026
  parts_min: 100
  parts_max: 1500
  compare_keywords: ["Millennium Falcon", "X-wing", "TIE", "AT-AT", "Star Destroyer"]
  compare_parts_min: 100

planner:
  default_mode: "exact"
  recommend_top_n: 10
  recommend_scope: ["core"]

compare:
  variant_markers: ["microfighter", "cockpit", "diorama", "mini", "midi", "bag charm", "key chain", "magnet", "bust", "helmet", "polybag", "mech", "battle pack"]
  set_ops_top_n: 15
  table_max_rows: 30

search:
  field_labels:
    year_from: "출시 연도 하한"
    year_to: "출시 연도 상한"
    parts_min: "최소 부품 수"
    parts_max: "최대 부품 수"
    subtheme: "서브테마"
    minifig: "미니피그 이름"
    has_minifig: "미니피그 포함 여부"
    name_keywords: "이름 키워드"
    exclude_keywords: "제외 키워드"
    limit: "결과 개수"
    sort: "정렬 기준"
    order: "정렬 방향"
  default_scopes: ["core", "compare_only"]
  sql_candidate_limit: 300
  review_top_n: 20
  result_limit: 12
  filter_prompt_version: "filter-v2"
  review_prompt_version: "review-v2"

router:
  llm_fallback: true
  retry_backoff_sec: 2
  error_log: "logs/orchestrator.log"
  min_confidence: 0.6
  prompt_version: "router-v4"
  build_archive_pool: 30
  history_answer_chars: 200
  selection_prompt_version: "selection-v1"
  search_cues: ["찾아", "검색", "보여줘", "알려줘 세트", "어떤 세트", "세트 목록", "있는 세트", "들어 있는", "들어있는", "find", "search", "show me", "list", "which sets", "sets with", "sets that"]
  set_number_year_range: [1950, 2035]
  recommend_followup_cues: ["다시 추천", "또 추천", "다른 거 추천", "recommend again"]
  compare_cues: ["연도별", "판본", "달라졌", "변천", "비교", "차이"]
  set_ops_cues: ["공통", "겹치", "같은 부품"]
  fact_cues: ["부품", "피스", "몇 개", "개수", "연도", "언제", "출시", "나왔", "미니피그", "미니피규어", "피규어", "피겨", "테마", "서브테마", "pieces", "parts", "minifig", "figure", "year", "released", "theme"]
  build_intent_cues: ["내 부품", "보유", "가진", "가지고", "만들", "제작", "조립", "부족", "커버리지", "색상", "색깔", "추천", "build", "owned", "own", "missing", "coverage", "recommend", "color"]
  recommendation_refs: ["그 기체", "그거", "그 세트"]
  recommendation_cues: ["추천", "만들 수 있는"]
  ignore_color_cues: ["색깔 상관없이", "색상 상관없이", "색깔 무시", "색상 무시", "색깔은 상관없", "색상은 상관없"]
chat:
  title_chars: 20
  request_timeout_sec: 300
